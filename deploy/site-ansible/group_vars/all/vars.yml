# --- Server ---------------------------------------------------------------
server_hostname: belfastgophers-web1

# --- People -----------------------------------------------------------------
# One entry per person. Their public keys go in files/keys/<name>.pub, one
# key per line; that file is the complete list, so removing a line revokes it.
#   admin:    member of wheel, full sudo (needs a hash in the vault)
#   deployer: member of the site group, can upload releases and restart it
users:
  - name: alan
    admin: true
    deployer: true

# Accounts to delete, home directory included. Remove someone from `users`
# AND list them here; dropping them from `users` alone leaves the account.
removed_users: []

# Admins' sudo password hashes live in the vault (openssl passwd -6).
# The vault is the source of truth: a password changed on the server is
# reset on the next run, so change it in the vault instead.
user_password_hashes: "{{ vault_user_password_hashes }}"

# --- Site -----------------------------------------------------------------
site_name: site                     # service name, system user, state dir
site_description: BelfastGophers_site
site_group: gophers                 # people (and CI) allowed to deploy
site_root: /opt/site

# HTTPS via Let's Encrypt, served by the binary itself. The domain and its
# www must resolve to this server before the first start. Set site_domain
# to "" to serve plain HTTP on site_port instead.
site_domain: belfastgophers.com
site_port: 443                      # 80 when site_domain is empty
site_http_port: 80                  # redirects to HTTPS
site_base_url: "https://{{ site_domain }}"

site_shutdown_delay: 0s             # no load balancer, so no drain needed
site_extra_args: ""                 # any further flags for the binary

# Absolute path to a locally built binary. Uploaded only when the server
# has no release yet; after that, deploys go through site-deploy.
site_binary_src: ""

# Written to /etc/site/site.env (root-only). Keep the values in the vault.
site_env: "{{ vault_site_env }}"

# --- Logs -----------------------------------------------------------------
# Vector sends the site's logs from journald to Better Stack. Both come from
# the Better Stack source: the ingesting host here, the token in the vault.
# Until both are set, the logs role is skipped.
betterstack_ingest_host: s2807876.us-west-2a.betterstackdata.com   # source belfastgophers_site
betterstack_token: "{{ vault_betterstack_token | default('') }}"

# --- Tools ------------------------------------------------------------------
# viu (terminal image viewer) from its GitHub release; Fedora doesn't ship it.
viu_version: 1.6.1
viu_sha256:                         # from the release's assets
  x86_64: f108265ff0441406290d5f53f64a2b88d4db530a7389a5dcd771bf782aa3ec6e
  aarch64: 64fd815cc4c9a215aab4e81e2165db78127a84789a8b04df060b3de82ac4613b

# --- Login message --------------------------------------------------------
# The logo shown to everyone at SSH login, drawn with viu, and a line below.
motd_logo_src: "{{ playbook_dir }}/files/motd-logo.png"
motd_logo_width: 30                 # columns
motd_logo_height: 15                # lines
motd_message: "Belfast Gophers · {{ server_hostname }}"

# --- CI deploy user -------------------------------------------------------
deploy_user: deploy
# Public half of the GitHub Actions key. Skipped if the file is absent.
deploy_pubkey_file: "{{ playbook_dir }}/files/gh_deploy.pub"

# --- ServerCat (iPhone monitoring app) ------------------------------------
# Read-only stats over SSH: the key can only run the commands listed in
# roles/servercat/files/allowed. Its public key is the complete list, so
# replacing the file rotates it. Key task skipped if the file is absent.
servercat_user: servercat
servercat_pubkey_file: "{{ playbook_dir }}/files/servercat.pub"
