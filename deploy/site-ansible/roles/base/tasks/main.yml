- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"
  when: server_hostname | default('') | length > 0

- name: Install packages
  ansible.builtin.package:
    name:
      - policycoreutils-python-utils   # semanage / sefcontext
      - sqlite                         # online backups of site.db
    state: present

# Fedora doesn't package viu, so it comes from the GitHub release, checked
# against its digest.
- name: Install viu
  ansible.builtin.get_url:
    url: "https://github.com/atanunq/viu/releases/download/v{{ viu_version }}/viu-{{ ansible_facts['architecture'] }}-unknown-linux-musl"
    checksum: "sha256:{{ viu_sha256[ansible_facts['architecture']] }}"
    dest: /usr/local/bin/viu
    owner: root
    group: root
    mode: "0755"

# --- systemd-resolved: stop listening for LLMNR/mDNS on public interfaces --
- name: Create resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Disable LLMNR and mDNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/no-llmnr.conf
    mode: "0644"
    content: |
      # Managed by Ansible
      [Resolve]
      LLMNR=no
      MulticastDNS=no
  notify: Restart systemd-resolved

# --- Login logo: viu draws it once, pam_motd shows it at every SSH login ----
- name: Copy the logo
  ansible.builtin.copy:
    src: "{{ motd_logo_src }}"
    dest: /usr/local/share/motd-logo.png
    owner: root
    group: root
    mode: "0644"

# The output only depends on the image and the flags, so writing it below is
# a no-op unless one of them changed. -b forces coloured blocks over the
# graphics protocols, which only work live in a terminal. In check mode on a
# fresh server there is no viu yet, so the MOTD is left for the real run.
- name: Render the logo
  ansible.builtin.command:
    argv: [/usr/local/bin/viu, -b, -t, -w, "{{ motd_logo_width }}", -h, "{{ motd_logo_height }}", /usr/local/share/motd-logo.png]
  environment:
    COLORTERM: truecolor
  register: motd_logo
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the MOTD directory
  ansible.builtin.file:
    path: /etc/motd.d
    state: directory
    mode: "0755"

# Named 00- so it comes before anything else in the MOTD, such as the
# reboot-required line.
- name: Write the MOTD
  ansible.builtin.copy:
    dest: /etc/motd.d/00-logo
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ motd_logo.stdout }}
      {{ motd_message }}
  when: motd_logo is succeeded

# --- People -----------------------------------------------------------------
- name: Create the site group
  ansible.builtin.group:
    name: "{{ site_group }}"

# Group membership is set exactly (append: false), so taking admin or
# deployer away from someone in vars.yml removes it on the server too.
- name: Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    groups: >-
      {{ (['wheel'] if item.admin | default(false) else [])
         + ([site_group] if item.deployer | default(false) else []) }}
    append: false
    password: "{{ user_password_hashes[item.name] | default(omit) }}"
    update_password: always
  loop: "{{ users }}"
  loop_control: { label: "{{ item.name }}" }

- name: Set authorised keys (exactly the keys in files/keys/<name>.pub)
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/keys/' ~ item.name ~ '.pub') }}"
    exclusive: true
  loop: "{{ users }}"
  loop_control: { label: "{{ item.name }}" }

- name: Remove departed users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ removed_users }}"

# --- sshd: keys only, no root. Applied by handler at the end of the run. ---
# AllowUsers is the people in vars.yml plus the two forced-command accounts,
# so an account created any other way can't log in. Forwarding is off: no
# one needs it, and agent forwarding would let anyone with root here use an
# organiser's agent while they are logged in.
- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0600"
    content: |
      # Managed by Ansible. Named 10- so it wins over 50-redhat.conf
      # and any 50-cloud-init.conf (first value read is used).
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers {{ (users | map(attribute='name') | list + [deploy_user, servercat_user]) | join(' ') }}
      AllowAgentForwarding no
      AllowTcpForwarding no
      AllowStreamLocalForwarding no
      X11Forwarding no
      PermitTunnel no
      LoginGraceTime 30
    validate: sshd -t -f %s
  notify: Restart sshd
