# Managed by httpgen. Changes are overwritten by 'go tool httpgen sync'.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      # Off until httpgen is released publicly, with the tool in go.mod: the
      # first sync after it is back restores this step.
      # - name: httpgen drift
      #   run: |
      #     go tool httpgen sync
      #     changes=$(git status --porcelain)
      #     if [ -n "$changes" ]; then
      #       echo "Managed files differ from the pinned httpgen templates."
      #       echo "Run 'go tool httpgen sync' and commit the result."
      #       echo "$changes"
      #       exit 1
      #     fi

  crap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # go-crap reads go list's JSON with its stderr mixed in, so the
      # "go: downloading" lines of a cold module cache break it. Download
      # what the packages and their tests need first.
      - run: go list -deps -test ./... > /dev/null
      # cmd is wiring, and is excluded. Everything else must stay under a
      # CRAP score of 30: complexity squared against missing coverage.
      - run: go run github.com/padiazg/go-crap@v0.5.1 scan --fail-above --threshold 30 --exclude 'cmd/.*' --no-progress

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
